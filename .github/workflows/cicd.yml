name: Test and deploy

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

# Runs on master queue up instead of overlapping, so an older commit can never
# be deployed after a newer one. A newer push replaces a run still waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Lint, Test and Build (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_WS_URL: wss://coup-back.freddysaez.es

  deploy:
    name: Deploy on Ploi (CD)
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Ploi checks out exactly the commit that passed the tests (the SHA
      # variable, see "Deploy on Ploi" in README.md) and runs
      # `docker compose up -d --build`. Deploying from here instead of Ploi's
      # quick deploy means a red build never reaches production.
      - name: Trigger Ploi deployment
        run: |
          if [ -z "$PLOI_DEPLOY_WEBHOOK" ]; then
            echo "::warning::PLOI_DEPLOY_WEBHOOK is not set, skipping deploy"
            exit 0
          fi
          curl --fail-with-body -sS -o /dev/null -X POST "$PLOI_DEPLOY_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"variables\": {\"sha\": \"$GITHUB_SHA\"}}"
        env:
          PLOI_DEPLOY_WEBHOOK: ${{ secrets.PLOI_DEPLOY_WEBHOOK }}
